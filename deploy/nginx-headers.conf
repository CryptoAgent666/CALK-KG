# ⛔ ГЛАВНОЕ И САМОЕ СРОЧНОЕ: ХОСТИНГ БЛОКИРУЕТ ПОИСКОВЫХ РОБОТОВ (403)
# ============================================================================
# Проверено 2026-08-03 с боевого сервера calk.kg:
#
#   User-Agent                          Ответ
#   ----------------------------------  -----
#   Mozilla/5.0 (compatible; YandexBot) 403 Forbidden   ← Яндекс НЕ ВИДИТ САЙТ
#   Mozilla/5.0 (compatible; bingbot)   403 Forbidden   ← Bing НЕ ВИДИТ САЙТ
#   Mozilla/5.0 (compatible; ClaudeBot) 403 Forbidden   ← AI-поиск не видит
#   Mozilla/5.0 (compatible; Googlebot) 200 OK
#   обычный браузер / curl              200 OK
#
# 403 отдаёт сам nginx (стандартная страница «403 Forbidden / nginx/1.30.2»),
# на ВСЕ адреса: /, /robots.txt, /sitemap.xml, /calculator/*.
# В .htaccess проекта таких правил нет (и он всё равно не применяется).
# Значит фильтр по User-Agent настроен в конфигурации nginx на стороне хостинга.
#
# СЛЕДСТВИЯ (обе жалобы Яндекс.Вебмастера объясняются этим):
#   • «Робот не смог получить доступ к файлу robots.txt» — робот получает 403;
#   • «Сайт недостаточно адаптирован под мобильные» — робот не может загрузить
#     ни HTML, ни CSS/JS, поэтому не может отрендерить и оценить страницу.
#
# ЧТО НУЖНО СДЕЛАТЬ ХОСТЕРУ: убрать YandexBot, bingbot и ClaudeBot из списка
# запрещённых User-Agent (или полностью отключить UA-фильтр для домена calk.kg).
# Правила индексации задаёт сам сайт в /robots.txt — блокировать ботов на уровне
# сервера не требуется.
#
# Если фильтр нужен для защиты от парсеров, попросите добавить исключения:
#
#   map $http_user_agent $blocked_agent {
#       default                 0;
#       ~*(YandexBot|YandexImages|YandexMobileBot)  0;   # Яндекс — разрешить
#       ~*(bingbot|BingPreview)                     0;   # Bing — разрешить
#       ~*(Googlebot|Google-InspectionTool)         0;   # Google — разрешить
#       ~*(ClaudeBot|GPTBot|OAI-SearchBot|PerplexityBot) 0;  # AI-поиск — разрешить
#       ~*(CCBot|Bytespider|cohere-ai|anthropic-ai)      1;  # тренировочные — блок
#   }
#   if ($blocked_agent) { return 403; }
#
# ПРОВЕРКА ПОСЛЕ ИСПРАВЛЕНИЯ (должно быть 200 у всех трёх):
#   curl -sI -A "Mozilla/5.0 (compatible; YandexBot/3.0; +http://yandex.com/bots)" https://calk.kg/robots.txt | head -1
#   curl -sI -A "Mozilla/5.0 (compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm)" https://calk.kg/ | head -1
#   curl -sI -A "Mozilla/5.0 (compatible; ClaudeBot/1.0)" https://calk.kg/ | head -1
# ============================================================================
# ============================================================================
# calk.kg — конфигурация nginx (заголовки безопасности, кэш, content-type)
# ============================================================================
# ЗАЧЕМ ЭТОТ ФАЙЛ
#
# На хостинге сайт обслуживает nginx (Server: nginx/1.30.2) БЕЗ Apache.
# Файл public/.htaccess (и его копия в dist/) сервером НЕ ЧИТАЕТСЯ — весь его
# контент игнорируется. Проверено 2026-07-27:
#   • security-заголовки из .htaccess не отдаются (0 из 6);
#   • Cache-Control на хешированных ассетах не ставится;
#   • rewrite og-images/*.png → *.svg не срабатывает (отдаётся image/png);
#   • .well-known/apple-app-site-association отдаётся как application/octet-stream,
#     хотя Apple требует application/json — universal links могут не работать.
#
# Эти директивы нужно добавить в конфигурацию nginx на стороне хостинга
# (в панели управления обычно есть поле «Дополнительные директивы nginx»
# для домена, либо через тех.поддержку — вставить в блок server {} сайта).
# ============================================================================

# --- Заголовки безопасности -------------------------------------------------
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# CSP: разрешены Google AdSense/GTM (реклама и аналитика) и НБКР (курсы валют).
# 'unsafe-inline'/'unsafe-eval' нужны сборке Vite + inline-скриптам аналитики.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://pagead2.googlesyndication.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://nbkr.kg https://www.google-analytics.com https://pagead2.googlesyndication.com; frame-src https://googleads.g.doubleclick.net https://www.youtube.com; object-src 'none'; base-uri 'self'" always;

# --- Кэширование ------------------------------------------------------------
# Хешированные ассеты (assets/*.js, *.css с хешем в имени) — можно кэшировать вечно.
location ~* ^/assets/.*\.(js|css|woff2?|svg|png|jpg|webp)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

# HTML — всегда перепроверять (сайт обновляется, кэш не должен «залипать»).
location ~* \.html$ {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}

# --- Apple App Site Association (universal links для iOS-приложения) ---------
# Файл без расширения; Apple ТРЕБУЕТ Content-Type: application/json.
location = /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Content-Type "application/json" always;
}

# --- Android App Links ------------------------------------------------------
location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
}

# --- Отдача pre-compressed файлов (в dist/ лежат .br и .gz) -----------------
# Требует модуль ngx_brotli для brotli_static; gzip_static есть почти везде.
gzip_static on;
# brotli_static on;   # раскомментировать, если модуль brotli собран

# ============================================================================
# ПРОВЕРКА ПОСЛЕ ПРИМЕНЕНИЯ
#   curl -sI https://calk.kg/ | grep -iE "strict-transport|content-security|x-frame|nosniff|referrer|permissions"
#   curl -sI https://calk.kg/.well-known/apple-app-site-association | grep -i content-type   # ждём application/json
#   curl -sI https://calk.kg/assets/<любой-хеш>.js | grep -i cache-control                   # ждём immutable
# ============================================================================
