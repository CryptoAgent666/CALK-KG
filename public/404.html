<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>Страница не найдена (404) | Calk.KG</title>
  <link rel="icon" type="image/svg+xml" href="/calculator-logo.svg" />
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fef2f2 0%, #ffffff 100%);
      color: #1f2937;
      padding: 24px;
    }
    .container {
      max-width: 600px;
      text-align: center;
    }
    .code {
      font-size: 120px;
      font-weight: 800;
      line-height: 1;
      color: #dc2626;
      letter-spacing: -4px;
    }
    h1 {
      font-size: 28px;
      margin: 16px 0 8px;
      color: #111827;
    }
    p { color: #4b5563; font-size: 18px; line-height: 1.5; margin: 0 0 28px; }
    .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.2s;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary {
      background: #dc2626;
      color: white;
    }
    .btn-primary:hover { background: #b91c1c; }
    .btn-secondary {
      background: white;
      color: #1f2937;
      border: 2px solid #e5e7eb;
    }
    .btn-secondary:hover { border-color: #dc2626; color: #dc2626; }
    .popular {
      margin-top: 40px;
      padding-top: 32px;
      border-top: 1px solid #e5e7eb;
    }
    .popular h2 { font-size: 14px; text-transform: uppercase; color: #6b7280; letter-spacing: 1px; margin-bottom: 16px; }
    .popular-links {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .popular-link {
      display: block;
      padding: 12px 16px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      text-decoration: none;
      color: #374151;
      font-size: 14px;
      transition: all 0.2s;
    }
    .popular-link:hover { border-color: #dc2626; color: #dc2626; }
    .brand {
      position: absolute;
      top: 24px;
      left: 24px;
      font-weight: 700;
      color: #dc2626;
      text-decoration: none;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <a href="/" class="brand">Calk.KG</a>
  <div class="container">
    <div class="code">404</div>
    <h1>Страница не найдена</h1>
    <p>Возможно, она была удалена или вы ошиблись в адресе.<br>Воспользуйтесь популярными калькуляторами ниже.</p>
    <div class="buttons">
      <a href="/" class="btn btn-primary">На главную</a>
      <a href="/sitemap" class="btn btn-secondary">Карта сайта</a>
    </div>
    <div class="popular">
      <h2>Популярные калькуляторы</h2>
      <div class="popular-links">
        <a href="/calculator/salary/" class="popular-link">💼 Зарплата</a>
        <a href="/calculator/loan/" class="popular-link">💳 Кредит</a>
        <a href="/calculator/customs/" class="popular-link">🚗 Растаможка</a>
        <a href="/calculator/electricity/" class="popular-link">💡 Электроэнергия</a>
        <a href="/calculator/currency-exchange/" class="popular-link">💱 Обмен валют</a>
        <a href="/calculator/alimony/" class="popular-link">👶 Алименты</a>
      </div>
    </div>
  </div>
</body>
</html>
