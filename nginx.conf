# nginx configuration for calk.kg
# Place this inside the server {} block or include it

# === Brotli compression (requires ngx_brotli module) ===
# Serve pre-compressed .br files generated by Vite build
brotli_static on;

# Fallback: dynamic Brotli compression
brotli on;
brotli_comp_level 6;
brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

# === Gzip fallback (for clients that don't support Brotli) ===
gzip_static on;
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

# === Cache-Control headers ===

# Immutable assets (hashed filenames from Vite)
location /assets/ {
    brotli_static on;
    gzip_static on;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
}

# OG images
location /og-images/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}

# Static files (favicon, manifest, robots.txt, llms.txt, sitemap)
location ~* \.(ico|webmanifest|txt|xml)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
}

# HTML pages — short cache for fresh content
location / {
    try_files $uri $uri/index.html /index.html;
    expires 1h;
    add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://pagead2.googlesyndication.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://nbkr.kg https://pagead2.googlesyndication.com; frame-src https://googleads.g.doubleclick.net;" always;
}
