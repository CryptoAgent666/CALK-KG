# Рекомендуемая конфигурация nginx для calk.kg
# Добавьте эти директивы в `server { ... }` блок для домена calk.kg
#
# После применения проверить:
#   1. https://securityheaders.com/?q=calk.kg
#   2. https://www.ssllabs.com/ssltest/analyze.html?d=calk.kg
#
# Текущий аудит выявил отсутствие ВСЕХ security headers.

server {
    listen 443 ssl http2;
    server_name calk.kg;

    # === SSL ===
    # ssl_certificate, ssl_certificate_key — уже настроено

    # Скрыть точную версию nginx (security through obscurity, минор-улучшение)
    server_tokens off;

    # === Security Headers ===

    # 1. HSTS — заставить браузеры использовать HTTPS на 1 год
    # IMPORTANT: убедитесь что весь сайт работает по HTTPS перед включением
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 2. Запретить браузерам угадывать MIME-тип (XSS prevention)
    add_header X-Content-Type-Options "nosniff" always;

    # 3. Защита от clickjacking — запретить iframe
    add_header X-Frame-Options "DENY" always;

    # 4. Управление referrer — не утечь полный URL внешним сайтам
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 5. Permissions-Policy — отключить ненужные browser API
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    # 6. Content-Security-Policy — самый важный header
    # Разрешает: self, Google Ads/Analytics, NBKR (currency API), inline scripts (нужно для React)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://*.googlesyndication.com https://*.googleadservices.com https://www.google-analytics.com https://pagead2.googlesyndication.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://www.nbkr.kg https://*.netlify.app https://www.google-analytics.com https://*.googlesyndication.com; frame-src https://www.googletagmanager.com https://*.googlesyndication.com https://*.doubleclick.net; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # === 404 fallback — наш брендированный 404 ===
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # === Apple App Site Association — должен возвращаться как application/json ===
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # === Android Asset Links ===
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # === SPA fallback (после 404.html) ===
    location / {
        try_files $uri $uri/ /index.html;
    }

    # === Static asset caching + Brotli serving ===
    # Если установлен ngx_brotli и в dist/ есть .br файлы — отдаём pre-compressed Brotli
    # (~20-25% меньше чем gzip). Иначе nginx сам сжимает gzip.
    # Установка ngx_brotli: apt install nginx-module-brotli  (или сборка с --add-module)
    #
    # brotli_static on;        # отдавать .br файлы если есть
    # brotli on;               # on-the-fly compression
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript
    #              text/xml application/xml application/xml+rss text/javascript
    #              image/svg+xml application/manifest+json;

    location ~* \.(js|css|svg|woff2|webp|png|jpg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-apply security headers (add_header не наследуется в location)
        add_header X-Content-Type-Options "nosniff" always;
    }

    # === gzip fallback (включить если Brotli недоступен) ===
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/manifest+json;

    # === HTML — короткий cache + revalidation ===
    location ~ \.html$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
}
